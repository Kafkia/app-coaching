{"name": "Publicar app", "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "read", "pages": "write", "id-token": "write"}, "concurrency": {"group": "pages", "cancel-in-progress": true}, "jobs": {"deploy": {"runs-on": "ubuntu-latest", "environment": {"name": "github-pages", "url": "${{ steps.d.outputs.page_url }}"}, "steps": [{"uses": "actions/checkout@v4"}, {"run": "mkdir -p site && Z=$(ls -t App_Coaching_PWA_*.zip | head -1) && unzip -o \"$Z\" -d site && for f in index.html sw.js manifest.webmanifest LEIA-ME.txt; do [ -f \"$f\" ] && cp \"$f\" site/ || true; done && [ -d icons ] && cp -r icons site/ || true; ls -R site"}, {"uses": "actions/configure-pages@v5"}, {"uses": "actions/upload-pages-artifact@v3", "with": {"path": "site"}}, {"id": "d", "uses": "actions/deploy-pages@v4"}]}}}
